name: Build and Release MAL Browser

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find . -maxdepth 4 -type f -name settings.gradle.kts -not -path './.gradle/*' | head -n 1)
          test -n "$SETTINGS" || { echo "settings.gradle.kts not found"; exit 1; }
          PROJECT_DIR=$(dirname "$SETTINGS")
          PROJECT_DIR=${PROJECT_DIR#./}
          [ -n "$PROJECT_DIR" ] || PROJECT_DIR=.
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download official Gradle 9.6.1
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 3 \
            -o "$RUNNER_TEMP/gradle-9.6.1-bin.zip" \
            "https://services.gradle.org/distributions/gradle-9.6.1-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-9.6.1-bin.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-9.6.1/bin/gradle" --version

      - name: Restore MAL release keystore
        shell: bash
        env:
          MAL_KEYSTORE_BASE64: ${{ secrets.MAL_KEYSTORE_BASE64 }}
        run: |
          test -n "$MAL_KEYSTORE_BASE64" || { echo "Missing secret MAL_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$MAL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mal-release.jks"
          test -s "$RUNNER_TEMP/mal-release.jks"

      - name: Build signed release APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          MAL_KEYSTORE_FILE: ${{ runner.temp }}/mal-release.jks
          MAL_KEYSTORE_PASSWORD: ${{ secrets.MAL_KEYSTORE_PASSWORD }}
          MAL_KEY_ALIAS: ${{ secrets.MAL_KEY_ALIAS }}
          MAL_KEY_PASSWORD: ${{ secrets.MAL_KEY_PASSWORD }}
        run: |
          test -n "$MAL_KEYSTORE_PASSWORD" || { echo "Missing secret MAL_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$MAL_KEY_ALIAS" || { echo "Missing secret MAL_KEY_ALIAS"; exit 1; }
          test -n "$MAL_KEY_PASSWORD" || { echo "Missing secret MAL_KEY_PASSWORD"; exit 1; }
          "$RUNNER_TEMP/gradle-9.6.1/bin/gradle" --no-daemon clean assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Prepare release files and update metadata
        id: version
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"

          APK_NAME="MALBrowser-${VERSION_NAME}.apk"
          TAG="v${VERSION_NAME}-vc${VERSION_CODE}"

          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" > "dist/$APK_NAME.sha256"

          python3 - <<PY
          import json
          from pathlib import Path
          notes_path = Path("UPDATE_NOTES.txt")
          notes = notes_path.read_text(encoding="utf-8").strip() if notes_path.exists() else "本次版本包含稳定性与体验更新。"
          Path("dist/update.json").write_text(json.dumps({
              "versionCode": int("$VERSION_CODE"),
              "versionName": "$VERSION_NAME",
              "apkAsset": "$APK_NAME",
              "changelog": notes
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MALBrowser-${{ steps.version.outputs.version_name }}-signed
          path: |
            ${{ steps.project.outputs.dir }}/dist/${{ steps.version.outputs.apk_name }}
            ${{ steps.project.outputs.dir }}/dist/${{ steps.version.outputs.apk_name }}.sha256
            ${{ steps.project.outputs.dir }}/dist/update.json
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          NOTES_FILE="UPDATE_NOTES.txt"
          if [ ! -s "$NOTES_FILE" ]; then
            printf '%s\n' '本次版本包含稳定性与体验更新。' > "$NOTES_FILE"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/$APK_NAME" \
              "dist/$APK_NAME.sha256" \
              "dist/update.json" \
              --clobber
            gh release edit "$TAG" --title "MAL 浏览器 $VERSION_NAME" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              "dist/$APK_NAME" \
              "dist/$APK_NAME.sha256" \
              "dist/update.json" \
              --title "MAL 浏览器 $VERSION_NAME" \
              --notes-file "$NOTES_FILE"
          fi
