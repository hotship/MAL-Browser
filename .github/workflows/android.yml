name: Build MAL Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MALBrowser_V3_2026-09-26

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build MAL APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload MAL APK
        uses: actions/upload-artifact@v4
        with:
          name: MALBrowser-APK
          path: MALBrowser_V3_2026-09-26/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
