name: Build MAL Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MALBrowser_V3_2026-09-26

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build MAL APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload MAL APK
        uses: actions/upload-artifact@v4
        with:
          name: MALBrowser-APK
          path: MALBrowser_V3_2026-09-26/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
