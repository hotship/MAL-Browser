name: Build MAL Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MALBrowser_V3_2026-09-26

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 9.6.1 directly
        shell: bash
        run: |
          rm -rf "$HOME/gradle-9.6.1" /tmp/gradle-9.6.1-bin.zip
          curl -fL --retry 3 --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-9.6.1-bin.zip \
            -o /tmp/gradle-9.6.1-bin.zip
          unzip -q /tmp/gradle-9.6.1-bin.zip -d "$HOME"
          chmod +x "$HOME/gradle-9.6.1/bin/gradle"
          "$HOME/gradle-9.6.1/bin/gradle" --version

      - name: Build MAL APK
        shell: bash
        run: |
          "$HOME/gradle-9.6.1/bin/gradle" --no-daemon assembleDebug --stacktrace

      - name: Upload MAL APK
        uses: actions/upload-artifact@v4
        with:
          name: MALBrowser-APK
          path: MALBrowser_V3_2026-09-26/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
